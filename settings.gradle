name: Build Spicy Ore Miner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod JAR
        run: ./gradlew build

      - name: Upload remapped JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spicy-ore-miner-jar
          path: build/libs/*.jar
          if-no-files-found: error
